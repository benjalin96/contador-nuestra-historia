        <div class="contador">

            <div class="tiempo">

                <span class="numero" id="dias">0</span>

                <span class="texto">Horas</span>

                <span class="numero" id="minutos">0</span>

    <script>

        // FECHA DE INICIO
        const fechaInicio = new Date(2019, 8, 7, 10, 0, 0);

        function actualizarContador() {

            const ahora = new Date();

            // AÑOS
            let años = ahora.getFullYear() - fechaInicio.getFullYear();

            let aniversario = new Date(
                fechaInicio.getFullYear() + años,
                fechaInicio.getMonth(),
                fechaInicio.getDate(),
                fechaInicio.getHours(),
                fechaInicio.getMinutes(),
                fechaInicio.getSeconds()
            );

            if (aniversario > ahora) {
                años--;
                aniversario = new Date(
                    fechaInicio.getFullYear() + años,
                    fechaInicio.getMonth(),
                    fechaInicio.getDate(),
                    fechaInicio.getHours(),
                    fechaInicio.getMinutes(),
                    fechaInicio.getSeconds()
                );
            }

            // MESES
            let meses =
                ahora.getMonth() - aniversario.getMonth();

            if (meses < 0) {
                meses += 12;
            }

            let fechaMes = new Date(
                aniversario.getFullYear(),
                aniversario.getMonth() + meses,
                aniversario.getDate(),
                aniversario.getHours(),
                aniversario.getMinutes(),
                aniversario.getSeconds()
            );

            if (fechaMes > ahora) {
                meses--;

                fechaMes = new Date(
                    aniversario.getFullYear(),
                    aniversario.getMonth() + meses,
                    aniversario.getDate(),
                    aniversario.getHours(),
                    aniversario.getMinutes(),
                    aniversario.getSeconds()
                );
            }

            // TIEMPO RESTANTE
            let diferencia = ahora - fechaMes;

            // DÍAS
            const dias = Math.floor(
                diferencia / 86400000
            );

            diferencia -= dias * 86400000;

            // HORAS
            const horas = Math.floor(
                diferencia / 3600000
            );

            diferencia -= horas * 3600000;

            // MINUTOS
            const minutos = Math.floor(
                diferencia / 60000
            );

            diferencia -= minutos * 60000;

            // SEGUNDOS
            const segundos = Math.floor(
                diferencia / 1000
            );

            // MOSTRAR
            document.getElementById("años").textContent = años;
            document.getElementById("meses").textContent = meses;
            document.getElementById("dias").textContent = dias;
            document.getElementById("horas").textContent = horas;
            document.getElementById("minutos").textContent = minutos;
            document.getElementById("segundos").textContent = segundos;
        }

        actualizarContador();

        setInterval(actualizarContador, 1000);
